name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
      JWT_SECRET: ci-test-secret-key
      # Database-backed tests skip when no postgres is reachable, so the suite still runs on a
      # laptop. In CI a skip is indistinguishable from a pass, which is how untested rules
      # survive — so here they must run or fail.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The clip tests (#411) run the real ffmpeg: normalization is the feature, so a skip
      # there would pass a broken upload.
      # Static ffmpeg + ffprobe from GitHub release storage (#477): apt on the runner hung or
      # failed on four runs in one afternoon, a stalled Ubuntu mirror. apt stays as a bounded
      # fallback rather than the only route.
      - name: Install ffmpeg
        id: ffmpeg
        continue-on-error: true
        timeout-minutes: 5
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install ffmpeg (apt fallback)
        if: steps.ffmpeg.outcome != 'success'
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get $APT update \
              && sudo timeout 150 apt-get $APT install -y --no-install-recommends ffmpeg \
              && break
            echo "apt attempt $attempt failed; retrying"; sleep 10
          done
      - name: Check ffmpeg
        run: ffmpeg -version | head -1 && ffprobe -version | head -1
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pytest pytest-asyncio
      - name: Test
        run: python -m pytest -q
